name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, curl, simplexml, mbstring
          coverage: none
          tools: none

      - name: PHP version
        run: php -v

      - name: Lint PHP sources
        run: |
          set -e
          find src bin tests -type f \( -name '*.php' -o -name 'trumpet' \) -print0 \
            | xargs -0 -n1 php -l

      - name: Run tests
        run: php tests/run.php

      - name: Verify CLI loads with example config
        env:
          TRUMPET_TOKEN_MYACCOUNT: dummy
          TRUMPET_TOKEN_SECONDARY: dummy
        run: |
          cp config/config.example.yaml config/config.yaml
          php bin/trumpet check
