services:
  trumpet:
    build: .
    image: trumpet-rss:latest
    container_name: trumpet
    restart: unless-stopped
    ports:
      - "${TRUMPET_HTTP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
